name: agentdiff
description: CI for AI agent behavior changes

inputs:
  command:
    description: "Command to run. Supported now: plan, classify, run, or demo."
    required: false
    default: classify
  base:
    description: "Base Git ref for plan/classify, or base trace path for run mode."
    required: false
  head:
    description: "Head Git ref for plan/classify, or head trace path for run mode."
    required: false
    default: HEAD
  base-ref:
    description: "Base Git revision for run revision mode."
    required: false
  head-ref:
    description: "Head Git revision for run revision mode."
    required: false
  files:
    description: "Comma-separated file list for plan or classify mode. If set, base/head are ignored."
    required: false
  policy:
    description: "Capability policy path for plan mode. Defaults to agentdiff.policy.json."
    required: false
  scenarios:
    description: "Scenario directory or JSON file for plan mode. Defaults to .agentdiff/scenarios."
    required: false
  run-reports:
    description: "Run report file or directory for plan execution evidence."
    required: false
  scenario:
    description: "Scenario JSON file to evaluate against the head trace in run mode."
    required: false
  harness-id:
    description: "Stable harness identity recorded in run provenance."
    required: false
  harness-module:
    description: "Repository-local JS module exporting harnessId and runScenario for run mode."
    required: false
  example:
    description: "Example name for run mode, such as coding-agent-harness."
    required: false
  recorded:
    description: "Use recorded traces for run mode."
    required: false
    default: "false"
  live:
    description: "Use live harness adapter for run mode."
    required: false
    default: "false"
  out:
    description: "Output directory for report.json and report.md."
    required: false
    default: .agentdiff/runs/latest
  github-token:
    description: "GitHub token used to create or update the sticky pull request comment."
    required: false

runs:
  using: node20
  main: packages/github-action/index.js
