name: agentdiff

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  plan:
    if: ${{ !contains(github.head_ref || '', 'coding-agent-edits-test') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate refund approval scenario
        continue-on-error: true
        run: >-
          node packages/cli/bin/agentdiff.js run
          --base-ref origin/${{ github.base_ref || 'main' }}
          --head-ref HEAD
          --harness-module examples/demo-support-agent/harness.js
          --scenario examples/support-ticket-agent/scenario.json
          --out .agentdiff/runs/evidence/refund-approval

      - uses: ./
        with:
          command: plan
          base: origin/${{ github.base_ref || 'main' }}
          head: HEAD
          scenarios: examples/support-ticket-agent/scenario.json
          run-reports: .agentdiff/runs/evidence
          out: .agentdiff/runs/latest
          github-token: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentdiff-report
          path: .agentdiff/runs

  recorded-harness:
    if: ${{ contains(github.head_ref || '', 'coding-agent-edits-test') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          command: run
          example: coding-agent-harness
          recorded: "true"
          out: .agentdiff/runs/latest
          github-token: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentdiff-report
          path: .agentdiff/runs
